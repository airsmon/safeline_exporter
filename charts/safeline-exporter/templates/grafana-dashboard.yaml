{{- if .Values.grafanaDashboard.enabled }}
{{- $content := required "grafanaDashboard.content is required when grafanaDashboard.enabled=true; pass it with --set-file" .Values.grafanaDashboard.content }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "safeline-exporter.fullname" . }}-grafana-dashboard
  namespace: {{ default .Release.Namespace .Values.grafanaDashboard.namespace | quote }}
  labels:
    {{- include "safeline-exporter.labels" . | nindent 4 }}
    {{- with .Values.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  {{ .Values.grafanaDashboard.filename | quote }}: |
    {{- $content | nindent 4 }}
{{- end }}
