{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "safeline-exporter.fullname" . }}
  labels:
    {{- include "safeline-exporter.labels" . | nindent 4 }}
  {{- with .Values.secret.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.existingSecretKey | quote }}: {{ required "secret.apiToken is required when secret.create=true" (index .Values.secret "apiToken") | quote }}
{{- end }}
